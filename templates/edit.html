<form action="/update/{{ aluno.id }}" method="post">

    <label>Nome:</label>
    <input type="text" name="nome" value="{{ aluno.nome }}" required>

    <label>Email:</label>
    <input type="email" name="email" value="{{ aluno.email }}" required>

    <label>Curso ID:</label>
    <input type="number" name="curso_id" value="{{ aluno.curso_id }}" required>

    <button type="submit">Salvar</button>
</form>
